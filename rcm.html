
<style>
:root{
  --bg:#08090d;
  --panel:rgba(255,255,255,.055);
  --panel-solid:#111319;
  --red:#ff394b;
  --gold:#dfbd78;
  --white:#f5f5f7;
  --muted:#a1a1ac;
  --border:rgba(255,255,255,.105);
  --glass:rgba(255,255,255,.045);
  --shadow:0 24px 70px rgba(0,0,0,.30);
  --radius:23px;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--white);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 8% 0%,rgba(255,57,75,.105),transparent 34%),
    radial-gradient(ellipse at 95% 25%,rgba(223,189,120,.065),transparent 32%),
    linear-gradient(145deg,#08090d,#0b0c11 55%,#08090d);
  -webkit-font-smoothing:antialiased;
}

button,a,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:4px;
}
::selection{background:rgba(255,57,75,.3);color:white}

/* APP SHELL */
.layout{
  display:flex;
  min-height:100vh;
}

/* GLASS SIDEBAR */
.sidebar{
  width:265px;
  flex-shrink:0;
  padding:25px 17px;
  display:flex;
  flex-direction:column;
  gap:30px;
  background:rgba(13,14,19,.76);
  border-right:1px solid var(--border);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 5px;
}

.brand-mark{
  width:45px;
  height:45px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:15px;
  color:white;
  font-size:21px;
  font-weight:900;
  background:linear-gradient(145deg,#ff5968,#cf142a);
  box-shadow:0 8px 27px rgba(255,57,75,.22);
}

.brand h2{
  font-size:15px;
  font-weight:800;
  letter-spacing:-.5px;
  margin:0;
}

.brand small{
  display:block;
  margin-top:5px;
  color:var(--gold);
  font-size:9px;
  letter-spacing:1.3px;
}

.nav-label{
  margin:5px 11px 13px;
  color:#777985;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
}

.nav{
  display:grid;
  gap:6px;
}

.nav button{
  position:relative;
  width:100%;
  min-height:45px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 13px;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:#a8a9b4;
  text-align:left;
  font-size:12px;
  font-weight:600;
  transition:background .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
}

.nav button:hover{
  color:white;
  background:rgba(255,255,255,.055);
  transform:translateX(2px);
}

.nav button.active{
  color:white;
  background:linear-gradient(100deg,rgba(255,57,75,.15),rgba(255,255,255,.035));
  border-color:rgba(255,57,75,.2);
  box-shadow:inset 3px 0 0 var(--red);
}

.nav button.active .ico{color:#ff6977}

.ico{
  width:22px;
  text-align:center;
  font-size:18px;
}

.side-bottom{margin-top:auto}

.plan-mini,
.card,
.stat{
  min-width:0;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.022));
  box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.plan-mini{
  padding:20px;
}

.plan-mini strong{
  display:block;
  margin:12px 0 8px;
  color:var(--gold);
  font-size:23px;
  letter-spacing:-.8px;
}

.plan-mini p{
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
}

/* MAIN CONTENT */
.main{
  flex:1;
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:8;
  min-height:77px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px 30px;
  border-bottom:1px solid var(--border);
  background:rgba(8,9,13,.75);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
}

.topbar-label{
  color:#9697a3;
  font-size:10px;
  letter-spacing:1.3px;
}

.topbar-label strong{
  display:block;
  margin-top:5px;
  color:white;
  font-size:15px;
  letter-spacing:-.35px;
}

.avatar{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:var(--gold);
  font-size:14px;
  font-weight:800;
  background:linear-gradient(145deg,rgba(255,57,75,.2),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.16);
}

.mobile-menu{display:none}

.content{
  width:100%;
  max-width:1450px;
  margin:0 auto;
  padding:32px;
}

.eyebrow{
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

h1,h2,h3,p{margin-top:0}

h1{
  margin:12px 0;
  font-size:clamp(29px,4vw,43px);
  font-weight:800;
  letter-spacing:-1.9px;
  line-height:1.13;
}

h2{
  font-size:20px;
  font-weight:750;
  letter-spacing:-.65px;
}

h3{
  font-size:15px;
  font-weight:700;
  letter-spacing:-.25px;
}

p{line-height:1.75}
.muted{color:var(--muted)}
.small{font-size:12px}
.gold{color:var(--gold)}
.red{color:var(--red)}

/* GLASS HERO */
.hero{
  position:relative;
  overflow:hidden;
  padding:36px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  background:
    radial-gradient(ellipse at 95% 0%,rgba(255,57,75,.18),transparent 43%),
    radial-gradient(ellipse at 0% 100%,rgba(223,189,120,.055),transparent 45%),
    linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.hero:after{
  content:"LDU";
  position:absolute;
  right:8px;
  bottom:-60px;
  pointer-events:none;
  color:rgba(255,255,255,.025);
  font-size:clamp(100px,17vw,200px);
  font-weight:900;
  letter-spacing:-15px;
}

.hero h1{
  position:relative;
  z-index:1;
}

.hero p{
  position:relative;
  z-index:1;
  max-width:680px;
  color:#b6b7c1;
  font-size:14px;
}

.hero-actions{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  margin-top:25px;
}

/* BUTTONS */
.btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 16px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  background:rgba(255,255,255,.055);
  color:white;
  font-size:11px;
  font-weight:750;
  transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.24);
}

.btn-red{
  color:white;
  border-color:rgba(255,57,75,.65);
  background:linear-gradient(135deg,#ff5261,#df1831);
  box-shadow:0 8px 26px rgba(255,57,75,.17);
}

.btn-red:hover{
  background:linear-gradient(135deg,#ff6572,#ed2540);
  box-shadow:0 10px 30px rgba(255,57,75,.24);
}

.btn-outline{
  background:rgba(255,255,255,.025);
  border-color:rgba(255,255,255,.16);
}

.btn:disabled{
  opacity:.48;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* GRIDS AND STAT CARDS */
.grid{
  display:grid;
  gap:17px;
}

.stats{
  grid-template-columns:repeat(3,minmax(0,1fr));
  margin:23px 0;
}

.stat{
  padding:22px;
  transition:transform .22s ease,border-color .22s ease;
}

.stat:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.2);
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:11px;
}

.stat-icon{
  color:var(--gold);
  font-size:20px;
}

.stat-value{
  margin:19px 0 7px;
  font-size:clamp(22px,3vw,30px);
  font-weight:800;
  letter-spacing:-1.1px;
  overflow-wrap:anywhere;
}

.stat-note{
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:29px 0 15px;
}

.section-head h2{margin:0}

.columns{
  grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);
}

.card{
  padding:22px;
}

.community,
.notice{
  margin-top:16px;
  padding:19px;
  border:1px solid rgba(223,189,120,.18);
  border-radius:19px;
  background:linear-gradient(145deg,rgba(223,189,120,.075),rgba(255,255,255,.025));
  color:#d4c8b0;
  font-size:12px;
  line-height:1.8;
}

.community p{
  margin:8px 0 15px;
  color:#aaaab5;
  font-size:12px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  max-width:100%;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  background:rgba(255,255,255,.045);
  color:#c9cad2;
  font-size:9px;
  font-weight:700;
  letter-spacing:.35px;
  overflow-wrap:anywhere;
}

/* PAGE SWITCHING */
.page{display:none}
.page.active{
  display:block;
  animation:pageAppear .35s ease both;
}

@keyframes pageAppear{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

/* COURSE CARDS */
.course-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  margin-top:23px;
}

.course-card{
  display:flex;
  flex-direction:column;
  gap:13px;
  min-width:0;
  padding:19px;
  border:1px solid var(--border);
  border-radius:23px;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.018));
  box-shadow:0 14px 35px rgba(0,0,0,.14);
  transition:transform .23s ease,border-color .23s ease;
}

.course-card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.22);
}

.course-art{
  min-height:120px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  border-radius:17px;
  background:
    radial-gradient(ellipse at 50% 20%,rgba(255,57,75,.22),transparent 65%),
    linear-gradient(145deg,#17151a,#0b0c10);
  color:var(--gold);
  font-size:24px;
  font-weight:800;
  letter-spacing:4px;
}

.course-card h3{margin:0}
.course-card p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

/* LESSONS AND PROGRESS */
.lesson-list{
  display:grid;
  gap:11px;
}

.lesson{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:15px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
  transition:background .2s ease,border-color .2s ease;
}

.lesson:hover{
  background:rgba(255,255,255,.065);
  border-color:rgba(255,255,255,.18);
}

.lesson-icon{
  width:44px;
  height:44px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,57,75,.16);
  border-radius:15px;
  background:rgba(255,57,75,.09);
  color:#ff7783;
  font-size:18px;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info h3{
  margin:0 0 6px;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.lesson-info p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

/* PROGRAMME FEES */
.price-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  margin-top:22px;
}

.price-card{
  min-width:0;
  padding:25px;
  border:1px solid var(--border);
  border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  box-shadow:0 15px 45px rgba(0,0,0,.17);
}

.price-card.featured{
  border-color:rgba(223,189,120,.45);
  background:
    radial-gradient(ellipse at 100% 0%,rgba(223,189,120,.1),transparent 55%),
    linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.018));
}

.price{
  margin:18px 0 12px;
  color:var(--gold);
  font-size:clamp(25px,3vw,34px);
  font-weight:800;
  letter-spacing:-1.1px;
  overflow-wrap:anywhere;
}

.price small{
  color:#aaaab4;
  font-size:11px;
  font-weight:500;
  letter-spacing:0;
}

.price-card p{line-height:1.8}

/* FORM FIELDS */
.field{
  display:grid;
  gap:8px;
  margin:16px 0;
}

.field label{
  color:#c5c6cf;
  font-size:11px;
  font-weight:650;
}

.field input{
  width:100%;
  min-width:0;
  padding:13px 14px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  background:rgba(0,0,0,.22);
  color:white;
  font-size:13px;
  outline:none;
  transition:border-color .2s ease,background .2s ease;
}

.field input:focus{
  border-color:rgba(255,57,75,.7);
  background:rgba(0,0,0,.34);
}

.field input[readonly]{
  color:#aaaab5;
  cursor:default;
}

/* STATUS MESSAGES */
.status{
  margin:13px 0;
  color:var(--gold);
  font-size:12px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.empty{
  padding:22px;
  border:1px solid var(--border);
  border-radius:17px;
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  background:rgba(255,255,255,.025);
}

/* FOOTER */
.footer{
  padding:24px 30px;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,.12);
  color:#81828d;
  font-size:10px;
  line-height:1.8;
  text-align:center;
}

/* TABLET */
@media(max-width:1050px){
  .sidebar{width:235px}
  .content{padding:25px}
  .columns{grid-template-columns:minmax(0,1.2fr) minmax(230px,1fr)}
  .stats{gap:12px}
  .stat{padding:18px}
}

/* MOBILE */
@media(max-width:760px){
  .layout{display:block}

  .sidebar{
    display:none;
    position:fixed;
    z-index:30;
    top:0;
    bottom:0;
    left:0;
    width:min(290px,86vw);
    overflow-y:auto;
    padding:23px 17px;
    background:rgba(12,13,18,.96);
    border-right:1px solid rgba(255,255,255,.13);
    box-shadow:25px 0 70px rgba(0,0,0,.5);
    backdrop-filter:blur(35px);
    -webkit-backdrop-filter:blur(35px);
  }

  .sidebar.open{
    display:flex;
    animation:sidebarAppear .22s ease both;
  }

  @keyframes sidebarAppear{
    from{opacity:0;transform:translateX(-12px)}
    to{opacity:1;transform:translateX(0)}
  }

  .mobile-menu{display:inline-flex}

  .topbar{
    min-height:70px;
    padding:12px 15px;
    gap:10px;
  }

  .topbar-label{
    max-width:55vw;
    font-size:8px;
    letter-spacing:.8px;
  }

  .topbar-label strong{
    font-size:13px;
    letter-spacing:-.2px;
  }

  .topbar .btn{
    padding:9px 11px;
    min-height:37px;
    font-size:10px;
  }

  .avatar{
    width:34px;
    height:34px;
    flex-shrink:0;
  }

  .content{padding:21px 15px}

  .hero{
    padding:27px 22px;
    border-radius:25px;
  }

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .stat{padding:16px}
  .stat-value{font-size:24px}

  .columns{grid-template-columns:minmax(0,1fr)}
  .course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .price-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .footer{padding:21px 15px}
}

/* SMALL PHONES */
@media(max-width:480px){
  .content{padding:17px 12px}
  .topbar{padding:11px 12px}
  .topbar-label{max-width:43vw}
  .topbar-label strong{font-size:12px}
  .topbar .btn{padding:8px 9px;font-size:9px}
  .topbar .mobile-menu{padding:8px 10px}
  .topbar>div:last-child{gap:7px}

  h1{
    font-size:30px;
    letter-spacing:-1.2px;
  }

  h2{font-size:18px}

  .hero{
    padding:24px 18px;
    border-radius:22px;
  }

  .hero p{font-size:12px}
  .hero-actions{gap:8px}
  .hero-actions .btn{flex:1;padding:11px 10px}

  .stats{gap:9px}
  .stat{padding:13px;border-radius:18px}
  .stat-top{font-size:9px}
  .stat-value{font-size:21px;letter-spacing:-.7px}
  .stat-note{font-size:9px}

  .card,.plan-mini{padding:18px}
  .section-head{margin-top:24px}

  .course-grid,.price-grid{grid-template-columns:minmax(0,1fr)}
  .course-art{min-height:105px}
  .course-card{padding:16px}

  .price-card{padding:21px}
  .price{font-size:31px}

  .lesson{padding:12px;gap:11px}
  .lesson-icon{width:39px;height:39px;border-radius:12px}
  .community,.notice{padding:16px}

  .pill{font-size:8px}
  .footer{font-size:9px}
}

/* REDUCED MOTION ACCESSIBILITY */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
