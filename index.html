<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111114">
<meta name="description" content="Discover Liquidity Displacement University™, with proprietary patterns and trader development.">
<title>Liquidity Displacement University™ | The Next Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f7f5;--white:#fff;--ink:#151619;--muted:#686b72;--line:#e5e5e2;--red:#d92736;--red-dark:#a91624;--soft:#fff0f1;--green:#147d51;--radius:22px;--max:1180px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.container{width:min(var(--max),calc(100% - 40px));margin:auto}
.announcement{background:var(--ink);color:#fff;text-align:center;padding:9px 14px;font-size:.76rem;letter-spacing:.07em;font-weight:700}
header{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:22px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em}
.brand-mark{height:42px;width:42px;display:grid;place-items:center;background:var(--red);color:white;border-radius:13px;font-size:.82rem}
.brand small{display:block;color:var(--muted);font-size:.64rem;letter-spacing:.1em;margin-top:2px}
.navlinks{display:flex;align-items:center;gap:24px;font-size:.88rem;color:#4c4e53}
.navlinks a:hover{color:var(--red)}
.navright{display:flex;gap:9px;align-items:center}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 19px;font-size:.88rem;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.primary{background:var(--red);color:white}
.primary:hover{background:var(--red-dark)}
.secondary{border-color:var(--line);background:white}
.small{padding:9px 14px;font-size:.8rem}
.menu{display:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px}
.hero{padding:78px 0 66px;background:radial-gradient(ellipse at 85% 10%,rgba(217,39,54,.11),transparent 38%),linear-gradient(135deg,#faf9f7 0%,#f2f1ef 100%);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(217,39,54,.13);border-radius:50%;right:-130px;top:-160px;box-shadow:0 0 0 35px rgba(217,39,54,.025),0 0 0 75px rgba(217,39,54,.02);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.73rem;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--red);margin-bottom:19px}
.kicker:before{content:"";height:2px;width:22px;background:var(--red)}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.055em;line-height:1.12}
h1{font-size:clamp(2.8rem,6vw,5.3rem);max-width:720px}
h1 em{font-style:normal;color:var(--red)}
.hero p{font-size:1.05rem;color:var(--muted);max-width:570px;margin:22px 0 27px;line-height:1.85}
.actions{display:flex;gap:11px;flex-wrap:wrap}
.hero-note{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.76rem;color:#55585e}
.hero-panel{background:var(--ink);color:#fff;border-radius:30px;padding:28px;min-height:380px;position:relative;overflow:hidden}
.hero-panel:after{content:"LDU";position:absolute;font-family:Manrope,sans-serif;font-size:10rem;font-weight:800;color:rgba(255,255,255,.045);right:-8px;bottom:-48px;letter-spacing:-.1em}
.panel-top{display:flex;justify-content:space-between;gap:15px;align-items:center}
.panel-label{font-size:.74rem;color:#b9bbc1}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#72dfac;margin-right:7px}
.mini-chart{width:100%;height:190px;margin:24px 0 20px;background:linear-gradient(180deg,#202126,#18191d);border:1px solid #33343a;border-radius:18px}
.panel-bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel-stat{border:1px solid #37383d;border-radius:15px;padding:14px}
.panel-stat small{display:block;color:#a9abb2;font-size:.7rem;margin-bottom:5px}
.panel-stat strong{font-size:.95rem}
.section{padding:78px 0}
.section-head{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:29px}
.section-head h2{font-size:clamp(2rem,4vw,3.1rem);max-width:680px}
.section-head p{max-width:490px;color:var(--muted);font-size:.94rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:var(--red);font-weight:800;margin-bottom:12px}
.featured{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.product{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:25px;display:flex;flex-direction:column;min-height:285px;position:relative}
.product.recommended{border:1.5px solid var(--red);box-shadow:0 10px 32px rgba(217,39,54,.08)}
.recommend{align-self:flex-start;background:var(--soft);color:var(--red-dark);font-size:.68rem;letter-spacing:.07em;font-weight:900;text-transform:uppercase;border-radius:999px;padding:6px 10px;margin-bottom:16px}
.product h3{font-size:1.35rem;margin-bottom:11px}
.product p{color:var(--muted);font-size:.88rem;line-height:1.75}
.price{font-family:Manrope,sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:-.04em;margin:20px 0 16px}
.price small{font-family:"DM Sans",sans-serif;font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:0}
.product .btn{width:100%;margin-top:auto}
.product-link{color:var(--red);font-size:.83rem;font-weight:800;margin-top:12px}
.store-layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.selector-panel,.checkout-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:25px}
.selector-panel h3,.checkout-panel h3{font-size:1.35rem;margin-bottom:7px}
.subtext{color:var(--muted);font-size:.85rem;margin-bottom:20px}
.choice{display:flex;gap:9px;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;min-width:0;transition:.18s}
.choice:has(input:checked){border-color:var(--red);background:#fff6f6;box-shadow:0 5px 18px rgba(217,39,54,.07)}
.choice:last-child{border-bottom:0}
.choice input{accent-color:var(--red);width:18px;height:18px;margin-top:4px;flex-shrink:0}
.choice-copy{flex:1;min-width:0}
.choice-copy strong{display:block;font-size:.83rem;line-height:1.35}
.choice-copy small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.choice-price{font-weight:800;font-size:.88rem;white-space:nowrap}
.qty-note{font-size:.75rem;color:var(--muted)}
.checkout-panel{position:relative;top:auto;background:linear-gradient(135deg,#17181d,#25262d);color:#fff;border-color:#303139;box-shadow:0 18px 45px rgba(21,22,25,.12)}
.checkout-panel .subtext{color:#b7b9c0}
.checkout-items{display:grid;gap:10px;margin:17px 0;max-height:220px;overflow:auto}
.checkout-line{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:#dedfe3}
.checkout-line span:last-child{white-space:nowrap}
.total-line{border-top:1px solid #393a40;padding-top:15px;margin-top:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.total-line strong{font-size:1.6rem;font-family:Manrope,sans-serif}
.discount{color:#83e2b2;font-size:.83rem;margin-top:8px}
.checkout-panel .btn{width:100%;margin-top:19px}
.selector-panel{background:linear-gradient(180deg,#fff,#fbfaf9)}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.product{box-shadow:0 12px 30px rgba(20,20,24,.035);transition:transform .2s,box-shadow .2s}
.product:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(20,20,24,.09)}
.rebrand-section{background:#141519;color:#fff;position:relative;overflow:hidden}
.rebrand-section:before{content:"LDU";position:absolute;right:-20px;top:-85px;font:900 clamp(10rem,25vw,22rem)/1 Manrope,sans-serif;letter-spacing:-.1em;color:rgba(255,255,255,.035);pointer-events:none}
.rebrand-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:stretch}
.rebrand-copy p{color:#c3c4ca;margin:18px 0;max-width:650px}
.rebrand-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rebrand-point{border:1px solid #34353c;border-radius:18px;padding:20px;background:linear-gradient(145deg,#202126,#17181c)}
.rebrand-point b{display:block;font-size:1rem;margin-bottom:8px}
.rebrand-point p{font-size:.82rem;color:#b4b6bd;margin:0}
.rebrand-label{color:#ff6873;font-size:.72rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.free-tag{display:inline-flex;background:#e3f6eb;color:#146b43;border-radius:999px;padding:5px 9px;font-size:.68rem;font-weight:900;margin-bottom:12px}
.secure-note{font-size:.72rem;color:#aeb0b8;text-align:center;margin-top:12px}
.form-label{font-size:.78rem;font-weight:800;display:block;margin:15px 0 6px}
.checkout-panel input,.checkout-panel select{width:100%;padding:12px 13px;border-radius:11px;border:1px solid #42434a;background:#222329;color:white}
.ad-banner{background:var(--soft);border:1px solid #f1c8cc;border-radius:var(--radius);padding:26px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.ad-banner h3{font-size:1.45rem;margin-bottom:7px}
.ad-banner p{color:#6d4a4d;font-size:.88rem}
.ad-label{font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;color:var(--red-dark);font-weight:900;margin-bottom:10px}
.pattern-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pattern{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;display:flex;flex-direction:column;justify-content:space-between;min-height:112px}
.pattern h3{font-size:.95rem;line-height:1.3;margin:0 0 12px}
.pattern .btn{width:100%;padding:10px 12px;font-size:.8rem}
.pattern-badge{display:inline-flex;align-self:flex-start;border-radius:999px;padding:5px 8px;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px;background:#fff0f1;color:#a71928}
.pattern-badge.recommended{background:#fff3d8;color:#875500}
.promo-modal{position:fixed;inset:0;background:rgba(12,13,16,.76);z-index:120;display:none;align-items:center;justify-content:center;padding:16px}
.promo-modal.open{display:flex}
.promo-dialog{position:relative;width:min(100%,520px);max-height:88vh;overflow:auto;border-radius:24px;padding:clamp(22px,5vw,34px);background:linear-gradient(145deg,#fff,#fff5f5);box-shadow:0 30px 100px #0006;border:1px solid #f2c5ca}
.promo-kicker{display:inline-block;background:#17181d;color:#fff;border-radius:999px;padding:7px 11px;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.promo-dialog h3{font-size:clamp(1.55rem,5vw,2.2rem);line-height:1.1;margin:16px 0 12px}
.promo-dialog p{color:#62636a;font-size:.9rem;line-height:1.7}
.promo-offers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.promo-offer{border:1px solid #e5d7d8;border-radius:16px;background:#fff;padding:14px}
.promo-offer strong{display:block;font-size:.88rem;line-height:1.4}
.promo-offer small{display:block;color:#777;font-size:.74rem;margin-top:6px}
.promo-dialog .close-modal{position:absolute;right:13px;top:13px;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
.promo-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.promo-actions .btn{width:100%;padding:12px 8px;font-size:.82rem}
@media(max-width:420px){.promo-offers,.promo-actions{grid-template-columns:1fr}}
.pattern-modal{position:fixed;inset:0;background:rgba(12,13,16,.68);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.pattern-modal.open{display:flex}
.pattern-dialog{background:#fff;border-radius:22px;padding:25px;width:min(100%,480px);max-height:85vh;overflow:auto;box-shadow:0 25px 80px #0005;position:relative}
.pattern-dialog h3{font-size:1.45rem;margin:6px 0 12px}
.pattern-dialog p{color:var(--muted);font-size:.92rem}
.pattern-dialog .detail-price{font-size:1.35rem;font-weight:900;margin:18px 0 12px}
.pattern-dialog .close-modal{position:absolute;right:14px;top:12px;border:0;background:#f2f2f0;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
@media(max-width:560px){.pattern-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pattern{padding:11px;min-height:96px;border-radius:13px}.pattern h3{font-size:.82rem;margin-bottom:8px}.pattern .btn{font-size:.72rem;padding:9px 6px}.pattern-dialog{padding:22px}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px}
.step-num{color:var(--red);font-weight:900;font-size:.76rem;letter-spacing:.1em}
.step h3{font-size:1.1rem;margin:13px 0 9px}
.step p{font-size:.86rem;color:var(--muted)}
.faq{max-width:850px;display:grid;gap:10px}
details{background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 18px}
summary{cursor:pointer;list-style:none;font-weight:800;padding:18px 25px 18px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:0;color:var(--red);font-size:1.25rem}
details[open] summary:after{content:"−"}
details p{color:var(--muted);font-size:.87rem;padding:0 0 18px}
footer{background:#151619;color:#fff;padding:45px 0 25px}
.footer-top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
footer p,footer a{color:#b8bac1;font-size:.82rem}
footer .brand{color:white}
footer .brand small{color:#aaa}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.disclaimer{border-top:1px solid #393a40;margin-top:30px;padding-top:20px;font-size:.72rem;line-height:1.8;color:#888b93}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#151619;color:#fff;padding:12px 17px;border-radius:12px;z-index:50;display:none;max-width:calc(100% - 28px);font-size:.85rem;box-shadow:0 8px 30px #0002}
@media(max-width:900px){.navlinks{display:none}.menu{display:block}.hero-grid,.store-layout,.rebrand-grid{grid-template-columns:1fr}.checkout-panel{position:static}.product-grid{grid-template-columns:repeat(2,1fr)}.pattern-list{grid-template-columns:repeat(3,minmax(0,1fr))}.section-head{display:block}.section-head p{margin-top:12px}.hero{padding-top:55px}}
@media(max-width:560px){.container{width:calc(100% - 28px)}#choices{grid-template-columns:1fr}.choice{padding:11px}.choice-price{font-size:.75rem}.rebrand-points{grid-template-columns:1fr}.hero-grid{gap:28px}.nav{height:68px}.brand{font-size:.83rem}.brand small{font-size:.56rem}.navright .secondary{display:none}.hero{padding:45px 0}.hero-panel{padding:20px;min-height:0}.product-grid,.steps{grid-template-columns:1fr}.product{min-height:0}.pattern-list{grid-template-columns:repeat(2,minmax(0,1fr))}.ad-banner{display:block}.ad-banner .btn{margin-top:16px;width:100%}.section{padding:58px 0}.section-head{margin-bottom:22px}.selector-panel,.checkout-panel{padding:19px}.choice-price{font-size:.8rem}}
</style>
</head>
<body>
<div class="announcement">TRADING EDUCATION • PROPRIETARY PATTERNS • CHOOSE YOUR LEARNING PATH</div>
<header>
