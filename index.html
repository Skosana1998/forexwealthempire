/* =====================================================
   FOREX WEALTH EMPIRE

===================================================== */

:root {
    --bg: #070707;
    --bg-soft: #0c0c0d;
    --panel: rgba(255,255,255,0.035);
    --panel-hover: rgba(255,255,255,0.065);
    --gold: #d9b56d;
    --gold-light: #ffe6a7;
    --red: #e32936;
    --red-dark: #8e101a;
    --white: #f7f7f7;
    --muted: #a4a4a4;
    --line: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.12);
    --radius: 22px;
    --max-width: 1200px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 100px;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--white);
    line-height: 1.7;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;

    background:
        radial-gradient(
            ellipse at 10% 10%,
            rgba(160, 15, 25, 0.13),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 90% 25%,
            rgba(217, 181, 109, 0.09),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 50% 100%,
            rgba(120, 15, 25, 0.12),
            transparent 40%
        );
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: 0.13;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 75px 75px;

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input,
textarea,
select {
    font: inherit;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

button {
    cursor: pointer;
}

img {
    display: block;
    max-width: 100%;
}

section {
    position: relative;
    padding: 105px 24px;
    scroll-margin-top: 85px;
}

.container {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
}

.section-heading {
    max-width: 760px;
    margin: 0 auto 55px;
    text-align: center;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;

    margin-bottom: 20px;
}

.eyebrow::before,
.eyebrow::after {
    content: "";
    height: 1px;
    width: 24px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.eyebrow::after {
    transform: rotate(180deg);
}

h1,
h2,
h3,
h4 {
    line-height: 1.15;
    letter-spacing: -1.2px;
}

h1 {
    font-size: clamp(42px, 7vw, 82px);
    font-weight: 800;
}

h2 {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
}

h3 {
    font-size: 22px;
    font-weight: 700;
}

.gradient-text {
    color: var(--gold);
    background: linear-gradient(
        110deg,
        #fff1c5 0%,
        #d9b56d 40%,
        #a8752a 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.red-text {
    color: var(--red);
}

.section-description {
    color: var(--muted);
    font-size: 15px;
    max-width: 680px;
    margin: 20px auto 0;
    line-height: 1.9;
}

.muted {
    color: var(--muted);
}

.small {
    font-size: 12px;
}

/* =====================================================
   SCROLL PROGRESS
===================================================== */

.scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 3px;
    z-index: 9999;

    background: linear-gradient(
        90deg,
        var(--red),
        var(--gold),
        var(--gold-light)
    );

    box-shadow: 0 0 15px rgba(217,181,109,0.5);
}

/* =====================================================
   ANNOUNCEMENT BAR
===================================================== */

.announcement {
    height: 34px;
    display: flex;
    align-items: center;
    overflow: hidden;

    background: #0d0b09;
    border-bottom: 1px solid rgba(217,181,109,0.2);
}

.announcement-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    width: max-content;

    animation: announcementMove 42s linear infinite;
}

.announcement:hover .announcement-track {
    animation-play-state: paused;
}

.announcement-item {
    padding: 0 35px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.7px;
    text-transform: uppercase;
    color: var(--gold);
}

.announcement-item span {
    color: var(--white);
    margin-left: 8px;
}

@keyframes announcementMove {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}

/* =====================================================
   HEADER
===================================================== */

.site-header {
    position: sticky;
    top: 0;

    background: rgba(7,7,7,0.77);
    backdrop-filter: blur(24px);

    border-bottom: 1px solid rgba(255,255,255,0.06);

}

    align-items: center;

}

    display: flex;

    content: "";

    inset: -4px;
    border: 1px solid rgba(217,181,109,0.08);
    border-radius: 16px;
}

.brand-name {

    font-weight: 800;
    letter-spacing: 1.1px;
    line-height: 1.4;
    text-transform: uppercase;
}

.brand-subtitle {
    display: block;
    font-size: 9px;

    content: "";

    left: 0;
    bottom: -8px;

    width: 0;

    background: var(--gold);
    transition: width 0.25s ease;
}

.nav-links a:hover {
    color: var(--gold-light);

.nav-links a:hover::after {

.nav-cta:hover {

.menu-toggle {

===================================================== */

}

.btn-gold:hover {
    box-shadow: 0 12px 38px rgba(217,181,109,0.28);
}

.btn-outline {
    color: white;

}

.btn-outline:hover {

.btn-red {

        120deg,

.btn-red:hover {

/* =====================================================
   HERO
===================================================== */

.hero {

}

.hero-glow {

    background: var(--gold);

/* HERO VISUAL */

.hero-visual {
    position: relative;
    min-width: 0;
    perspective: 1000px;
}

.terminal {
    position: relative;
    overflow: hidden;

    padding: 23px;

        linear-gradient(

    box-shadow:

}

.terminal-title {
    font-family: 'Orbitron', sans-serif;

}

.terminal-status {
    font-size: 9px;
    color: #7ee0a8;
}

.terminal-chart {
    height: 230px;
    position: relative;
    margin: 20px 0;
    overflow: hidden;

    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.05);

    background:
        linear-gradient(
            rgba(255,255,255,0.035) 1px,
            transparent 1px

        linear-gradient(
            90deg,
            rgba(255,255,255,0.035) 1px,
            transparent 1px

.chart-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.terminal-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

.terminal-stat {
    padding: 13px 10px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 11px;
    background: rgba(0,0,0,0.2);
}

.terminal-stat span {
    display: block;
    color: #888;
    font-size: 9px;
    margin-bottom: 5px;
}

.terminal-stat strong {
    font-size: 13px;
    color: var(--gold);
}

.floating-tag {
    position: absolute;
    z-index: 3;

    padding: 13px 16px;

    border: 1px solid rgba(217,181,109,0.3);
    border-radius: 13px;

    background: rgba(15,15,15,0.84);

    box-shadow: 0 15px 40px rgba(0,0,0,0.35);

}

.floating-tag span {
    display: block;
    margin-top: 4px;
    color: var(--gold);
    font-size: 12px;
}

.tag-one {
    top: 55px;
    left: -35px;
}

.tag-two {
    right: -20px;
    bottom: 60px;
}

@keyframes terminalFloat {
    0%, 100% {
        transform: translateY(0) rotateY(-5deg) rotateX(2deg);
    }

    50% {
        transform: translateY(-10px) rotateY(-2deg) rotateX(1deg);
    }
}

@keyframes glowFloat {
    from {
        transform: translate3d(0,0,0) scale(1);
    }

    to {
        transform: translate3d(-25px,20px,0) scale(1.08);
    }
}
